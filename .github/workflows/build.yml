name: Auto Build Renamed Convx

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if version is up to date'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Check Upstream vs Fork Version
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/cosmictaserdev-creator/Convx/releases --jq '.[0].tag_name')
          UPSTREAM_ASSET_TIME=$(gh api repos/cosmictaserdev-creator/Convx/releases --jq '.[0].assets[0].updated_at' || echo "")
          MY_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "none")
          MY_ASSET_TIME=$(gh api repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG --jq '.assets[0].updated_at' 2>/dev/null || echo "none")

          echo "Upstream latest tag: $UPSTREAM_TAG (asset updated: $UPSTREAM_ASSET_TIME)"
          echo "Fork latest tag: $MY_TAG (asset updated: $MY_ASSET_TIME)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger -> force build enabled."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_TAG" != "$MY_TAG" ] || [ "$UPSTREAM_ASSET_TIME" != "$MY_ASSET_TIME" ] || [ "$MY_ASSET_TIME" = "none" ]; then
            echo "New upstream release/build detected ($UPSTREAM_TAG)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date ($MY_TAG). Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: cosmictaserdev-creator/Convx
          ref: ${{ needs.check.outputs.tag }}
          submodules: recursive

      - name: Rename Package Identifier to Apple Music for OriginOS Island
        run: |
          TARGET_ID="com.apple.android.music"
          find . -name "build.gradle.kts" -o -name "build.gradle" | while read -r file; do
            sed -i -E "s/applicationId(\s*=\s*|\s+).*.\"/applicationId = \"$TARGET_ID\"/" "$file" 2>/dev/null || true
            sed -i -E "s/applicationId\s+\".*\"/applicationId \"$TARGET_ID\"/" "$file" 2>/dev/null || true
          done
          # Update launcher shortcuts targetPackage
          sed -i -E "s/android:targetPackage=\"[^\"]*\"/android:targetPackage=\"$TARGET_ID\"/g" app/src/main/res/xml/shortcuts.xml 2>/dev/null || true

          # Neutralize built-in updater so it never shows update popups pointing to upstream
          find . -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's|api.github.com/repos/cosmictaserdev-creator/Convx|127.0.0.1|g' {} +

          echo "Verified applicationId replacement:"
          grep -rn "applicationId" app/ || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleArm64GmsRelease -x lint -x lintVitalArm64GmsRelease

      - name: Download Uber APK Signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK with Fixed Certificate
        run: |
          mkdir -p signed_apks
          RAW_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          java -jar uber-apk-signer-1.3.0.jar \
            --apks "$RAW_APK" \
            --allowResign \
            --out signed_apks
          SIGNED_FILE=$(find signed_apks -name "*aligned-debugSigned.apk" | head -n 1)
          if [ -n "$SIGNED_FILE" ]; then
            cp "$SIGNED_FILE" "signed_apks/convx-${{ needs.check.outputs.tag }}.apk"
            cp "$SIGNED_FILE" "signed_apks/convx-origin-island.apk"
          fi
          echo "Signed files ready for release:"
          ls -lh signed_apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Convx ${{ needs.check.outputs.tag }} (Origin Island Edition)
          draft: false
          prerelease: false
          files: signed_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
